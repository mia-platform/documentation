name: Test deployment

on:
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: yarn install
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: yarn install --frozen-lockfile
      - name: Test build website
        run: yarn build

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: yarn install
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: yarn install --frozen-lockfile
      # cspell exits non-zero both when it finds misspellings and when it cannot run
      # (invalid config, no files matched, unsupported Node), so any problem fails the job.
      - name: Spellcheck documentation
        run: yarn spellcheck
